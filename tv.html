<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#10141b;--card:#181e28;--fg:#e8ebf0;--mu:#8f98a8;--bd:#2a323f;--ac:#e08a3c}
*{box-sizing:border-box}
html{font-size:1.15vw}
body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--fg);font:400 1rem/1.35 Inter,system-ui,sans-serif}
#app{display:grid;grid-template-columns:36vw 1fr 1fr;grid-template-rows:auto 1fr 21vh;gap:1rem;padding:1rem;height:100vh}
header{grid-column:1/4;display:flex;justify-content:space-between;align-items:center}
.hd{display:flex;align-items:center;gap:1rem}.hd svg{height:4.4rem;width:auto;display:block}
h1{font:600 2.6rem/1 "Playfair Display",Georgia,serif;margin:0}
#st{font:500 1.5rem Inter,sans-serif;color:var(--mu)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:1rem;overflow:hidden;min-height:0;position:relative}
#feat{grid-row:2/4}
#feat img,.tile img{position:relative;width:100%;height:100%;object-fit:contain;display:block}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(1.2rem) brightness(.6);transform:scale(1.25)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:2rem 1.4rem .9rem;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font:600 2.2rem "Playfair Display",Georgia,serif}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);font-size:1.6rem}
.empty svg{width:14rem;margin-bottom:1rem}
.pop{animation:pop .8s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.lab{font:600 .85rem Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:.4rem}
#board{grid-column:2;grid-row:2;padding:1rem 1.2rem}
.row{padding:.5rem 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.rh{display:flex;justify-content:space-between;font-size:1.25rem;font-weight:600}
.rh span{font-weight:400;color:var(--mu);font-size:1rem}
.seg{display:flex;gap:.2rem;margin:.4rem 0}.seg i{flex:1;height:.55rem;background:#2a323f;border-radius:.2rem}
small{color:var(--mu);font-size:.9rem}
#chat{grid-column:3;grid-row:2;padding:1rem 1.2rem;display:flex;flex-direction:column}
.ms{margin-top:auto;display:flex;flex-direction:column;gap:.5rem}
.cm{font-size:1.2rem;padding:.45rem .8rem;background:rgba(255,255,255,.05);border-radius:.6rem}
.cm.new{border-left:.25rem solid var(--ac);background:rgba(255,255,255,.09)}
.sy{color:var(--mu);font-style:italic}
#tiles{grid-column:2/4;grid-row:3;display:grid;grid-template-columns:repeat(5,1fr);gap:1rem}
.tile{border:2px solid;border-radius:.8rem;overflow:hidden;position:relative;background:var(--card)}
.tile span{position:absolute;left:.5rem;bottom:.5rem;padding:.1rem .6rem;border-radius:.4rem;color:#fff;font:600 .95rem Inter,sans-serif}
#ban{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,16,.85);color:#fff;font:600 4.5rem/1.15 "Playfair Display",Georgia,serif;text-align:center;padding:2rem;z-index:5}
</style></head><body>
<div id="app">
 <header><div class="hd"><span id="logo"></span><h1>Thanksgiving Treasure Hunt</h1></div><div id="st"></div></header>
 <div class="box" id="feat"></div>
 <div class="box" id="board"></div>
 <div class="box" id="chat"></div>
 <div id="tiles"></div>
</div>
<div id="ban"></div>
<script type="module">
import {db,doc,collection,onSnapshot,query,orderBy,limit,TEAMS} from "./config.js";
const $=i=>document.getElementById(i);
const COL={owl:"#8f89e0",fox:"#e0714a",bear:"#c9953a",wolf:"#3fb08a",hawk:"#4a95e0"};
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
let G={},TS={},LT={},featTs=0,first=true,ann=new Set(),bt=0,CH=[],lastC="";

const TURKEY=`<svg viewBox='0 0 200 190' role='img' aria-label='Cartoon turkey'><g stroke='#3b1d0a' stroke-width='4' stroke-linejoin='round'><ellipse cx='100' cy='60' rx='17' ry='48' fill='#e63946' transform='rotate(-72 100 120)'/><ellipse cx='100' cy='60' rx='17' ry='48' fill='#ff8a1f' transform='rotate(-36 100 120)'/><ellipse cx='100' cy='60' rx='17' ry='48' fill='#ffd23f'/><ellipse cx='100' cy='60' rx='17' ry='48' fill='#2a9d4b' transform='rotate(36 100 120)'/><ellipse cx='100' cy='60' rx='17' ry='48' fill='#2f80ed' transform='rotate(72 100 120)'/><ellipse cx='100' cy='135' rx='50' ry='42' fill='#9c5a2b'/><ellipse cx='100' cy='142' rx='30' ry='26' fill='#d9a066' stroke='none'/><circle cx='100' cy='100' r='30' fill='#9c5a2b'/><circle cx='88' cy='96' r='8' fill='#fff'/><circle cx='112' cy='96' r='8' fill='#fff'/><circle cx='90' cy='97' r='3.5' stroke='none'/><circle cx='110' cy='97' r='3.5' stroke='none'/><path d='M92 106h16l-8 14z' fill='#ffb703'/><path d='M97 120q-3 14 3 16q6-2 3-16z' fill='#e63946'/><rect x='80' y='44' width='40' height='32' rx='4' fill='#2b2b2b'/><rect x='80' y='64' width='40' height='9' fill='#ffd23f'/><rect x='68' y='72' width='64' height='9' rx='4' fill='#2b2b2b'/></g></svg>`;$("logo").innerHTML=TURKEY;
onSnapshot(doc(db,"game","state"),s=>{G=s.data()||{}});
onSnapshot(collection(db,"teams"),s=>{
 TS={};s.docs.forEach(d=>TS[d.id]=d.data());
 s.docs.forEach(d=>{const t=d.data();
  if(t.done&&!ann.has(d.id)){ann.add(d.id);if(!first)banner(t.name+" finished in "+fmt((t.done-G.startAt)/1000)+"!")}
  if(!t.done)ann.delete(d.id)});
 first=false});
onSnapshot(collection(db,"latest"),s=>{LT={};s.docs.forEach(d=>LT[d.id]=d.data());photos()});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
onSnapshot(query(collection(db,"chat"),orderBy("ts","desc"),limit(30)),s=>{CH=s.docs.map(d=>({id:d.id,...d.data()})).reverse();chat()});
function chat(){const m=CH.slice(-8),el=$("chat");
 const nw=m.length&&m[m.length-1].id!==lastC;if(m.length)lastC=m[m.length-1].id;
 el.innerHTML=`<div class="lab">Trash talk</div><div class="ms">${m.length?m.map((x,i)=>`<div class="cm${i==m.length-1?" new"+(nw?" pop":""):""}">${x.sys?`<span class="sy">${esc(x.text)}</span>`:`<b style="color:${COL[x.team]||"#aaa"}">${esc(x.name)}</b> ${esc(x.text)}`}</div>`).join(""):`<div class="cm">Messages from the teams will show up here.</div>`}</div>`}

function banner(t){const b=$("ban");b.textContent=t;b.style.display="flex";clearTimeout(bt);bt=setTimeout(()=>b.style.display="none",9000)}

function photos(){
 const f=Object.values(LT).sort((a,b)=>b.ts-a.ts)[0],F=$("feat");
 if(!f)F.innerHTML=`<div class="empty">${TURKEY}<p>Waiting for photos…</p></div>`;
 else{const nw=f.ts!==featTs;featTs=f.ts;
  F.innerHTML=`<div class="bg" style="background-image:url('${f.img}')"></div><img src="${f.img}" alt=""><div class="cap">${f.name}</div>`;
  if(nw){F.classList.remove("pop");void F.offsetWidth;F.classList.add("pop")}}
 $("tiles").innerHTML=Object.keys(TEAMS).map(c=>{const l=LT[c];
  return `<div class="tile" style="border-color:${COL[c]}">${l?`<div class="bg" style="background-image:url('${l.img}')"></div><img src="${l.img}" alt="">`:""}<span style="background:${COL[c]}">${TEAMS[c].name}</span></div>`}).join("")}

function board(){
 const now=Date.now(),go=G.started&&G.startAt<=now;
 $("st").textContent=!G.started?"Waiting to start":go?"Hunt in progress":"Starting in "+Math.ceil((G.startAt-now)/1000);
 const rows=Object.keys(TEAMS).map(c=>({c,n:TEAMS[c].route.length,t:TS[c]||{i:0,hintsTotal:0,t0:0,done:0}}));
 rows.sort((a,b)=>{const x=a.t,y=b.t;if(!!x.done!==!!y.done)return x.done?-1:1;if(x.done)return x.done-y.done;return(y.i-x.i)||((x.t0||0)-(y.t0||0))});
 $("board").innerHTML='<div class="lab">Leaderboard</div>'+rows.map((r,k)=>{const t=r.t,h=t.hintsTotal||0;
  return `<div class="row"><div class="rh"><b>${k+1}. ${TEAMS[r.c].name}</b><span>${t.done?"Finished in "+fmt((t.done-G.startAt)/1000):go?"Clue "+(t.i+1)+" of "+r.n:"Ready"}</span></div>
  <div class="seg">${Array.from({length:r.n},(_,j)=>`<i style="${j<t.i?"background:"+COL[r.c]:""}"></i>`).join("")}</div>
  <small>${go&&!t.done?"On this clue "+fmt((now-(t.t0||G.startAt))/1000)+" · ":""}${h} hint${h==1?"":"s"} used</small></div>`}).join("")}
setInterval(board,1000);board();photos();
</script></body></html>
